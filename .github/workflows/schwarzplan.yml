# Erzeugt die Schwarzpläne (Gebäude aus OpenStreetMap) für das TRMNL-Plugin "Schwarzplan"
# und legt Bilder und Liste (schwarzplan.json) im selben Release ab wie die Plugin-ZIPs.
# Overpass ist langsam: Sechs Teile zeichnen gleichzeitig (jeder Rechner hat sein eigenes Kontingent),
# jedes fertige Bild wird sofort hochgeladen. Nach höchstens 50 Minuten schreibt ein letzter Schritt
# die Liste und startet die nächste Runde, bis alle Orte aus orte.json fertig sind.
name: Schwarzpläne erzeugen

on:
  push:
    paths:
      - "trmnl/kunst/schwarzplan/**"
      - ".github/workflows/schwarzplan.yml"
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Orte neu zeichnen (Kürzel mit Komma, leer = alle fehlenden)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: schwarzplan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then TAG=trmnl; else TAG="trmnl-$(echo "$BRANCH" | sed 's#^claude/##; s#[^A-Za-z0-9._-]#-#g')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  plaene:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        teil: [0, 1, 2, 3, 4, 5]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fertige Pläne holen
        run: |
          mkdir -p plaene
          gh release download "$RELEASE_TAG" --pattern 'schwarzplan-*.png' --dir plaene || true
          gh release download "$RELEASE_TAG" --pattern 'fehlgeschlagen*.json' --dir plaene || true
      - name: Teil ${{ matrix.teil }} zeichnen (höchstens 50 Minuten, jedes Bild sofort hochladen)
        run: |
          python3 trmnl/kunst/schwarzplan/erzeugen.py --orte trmnl/kunst/schwarzplan/orte.json --ziel plaene --minuten 50 \
            --teil ${{ matrix.teil }} --teile 6 --anzahl 120 --nur "${{ github.event.inputs.nur }}" --ausgabe /dev/null
      - name: Fehlschläge dieses Teils ablegen
        if: always()
        run: gh release upload "$RELEASE_TAG" plaene/fehlgeschlagen-${{ matrix.teil }}.json --clobber || true

  liste:
    needs: [tag, plaene]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Liste aller fertigen Pläne schreiben
        id: liste
        run: |
          mkdir -p plaene
          gh release download "$RELEASE_TAG" --pattern 'schwarzplan-*.png' --dir plaene || true
          gh release download "$RELEASE_TAG" --pattern 'fehlgeschlagen*.json' --dir plaene || true
          python3 trmnl/kunst/schwarzplan/erzeugen.py --orte trmnl/kunst/schwarzplan/orte.json --ziel plaene --minuten 0 --anzahl 120 \
            --basis-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/trmnl/bilder/schwarzplan/" --hochladen ""
      # Bilder ins Repository (als image/png abrufbar), die Liste zusätzlich unter der bisherigen Release-Adresse
      - name: Ins Repository und Release legen
        run: |
          mkdir -p trmnl/bilder/schwarzplan
          cp plaene/schwarzplan-*.png plaene/schwarzplan.json trmnl/bilder/schwarzplan/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trmnl/bilder/schwarzplan
          if ! git diff --cached --quiet; then
            git commit -q -m "Schwarzpläne aktualisiert"
            for i in 1 2 3 4 5 6; do
              git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
              sleep $((i * 7))
            done
          fi
          gh release upload "$RELEASE_TAG" plaene/schwarzplan.json --clobber
      - name: Nächste Runde starten, falls noch Orte fehlen
        if: ${{ steps.liste.outputs.fehlend != '0' && github.event.inputs.nur == '' }}
        run: gh workflow run schwarzplan.yml --ref "${GITHUB_REF_NAME}"
