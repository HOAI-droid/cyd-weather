# Bildarchive für die TRMNL-Plugins (Merian-Stiche, Vogelbilder, historische Karten) von Wikimedia Commons.
# Schritt 1: Kandidaten suchen und als kandidaten-*.json im Release ablegen.
name: Bildarchive holen

on:
  push:
    paths:
      - "trmnl/kunst/bildarchiv/sammlungen.json"
      - "trmnl/kunst/bildarchiv/entdecken.py"
      - ".github/workflows/bildarchiv.yml"
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Sammlungen (merian, voegel, karten; leer = alle)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: bildarchiv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sammlung: [merian, voegel, karten]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release-Name bestimmen
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then TAG=trmnl; else TAG="trmnl-$(echo "$BRANCH" | sed 's#^claude/##; s#[^A-Za-z0-9._-]#-#g')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Kandidaten auf Commons suchen
        if: ${{ github.event.inputs.nur == '' || contains(github.event.inputs.nur, matrix.sammlung) }}
        run: python3 trmnl/kunst/bildarchiv/entdecken.py --sammlungen trmnl/kunst/bildarchiv/sammlungen.json --ziel archiv --nur "${{ matrix.sammlung }}"

      - name: Kandidatenlisten ins Release legen
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event.inputs.nur == '' || contains(github.event.inputs.nur, matrix.sammlung) }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" archiv/kandidaten-${{ matrix.sammlung }}.json --clobber
