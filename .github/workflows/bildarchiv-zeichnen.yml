# Bildarchive, Schritt 2: Die Auswahl (trmnl/kunst/bildarchiv/auswahl/, von auswaehlen.py) laden,
# für das Graustufen-Display umrechnen und mit der Liste <sammlung>.json ins Release legen.
# Bei den Vögeln holt texte.py vorher deutschen Namen, Familie und Kurztext (Wikidata, Wikipedia).
name: Bildarchive zeichnen

on:
  push:
    paths:
      - "trmnl/kunst/bildarchiv/auswahl/**"
      - "trmnl/kunst/bildarchiv/zeichnen.py"
      - "trmnl/kunst/bildarchiv/texte.py"
      - ".github/workflows/bildarchiv-zeichnen.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bildarchiv-zeichnen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zeichnen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sammlung: [merian, voegel, karten]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: Release-Name bestimmen
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then TAG=trmnl; else TAG="trmnl-$(echo "$BRANCH" | sed 's#^claude/##; s#[^A-Za-z0-9._-]#-#g')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Auswahl vorbereiten
        run: |
          mkdir -p auswahl bilder
          if [ "${{ matrix.sammlung }}" = voegel ]; then
            python3 trmnl/kunst/bildarchiv/texte.py --ein trmnl/kunst/bildarchiv/auswahl/auswahl-voegel.json \
              --aus auswahl/auswahl-voegel.json --anzahl 120
          else
            cp trmnl/kunst/bildarchiv/auswahl/auswahl-${{ matrix.sammlung }}.json auswahl/
          fi

      - name: Bilder laden und umrechnen
        run: |
          python3 trmnl/kunst/bildarchiv/zeichnen.py --sammlungen trmnl/kunst/bildarchiv/sammlungen.json \
            --auswahl auswahl --ziel bilder --nur ${{ matrix.sammlung }} --minuten 45 \
            --basis-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/trmnl/bilder/${{ matrix.sammlung }}/"

      # Bilder ins Repository (raw.githubusercontent.com liefert sie als image/png aus; aus dem Release
      # kämen sie als Datei-Download), die Liste zusätzlich unter der bisherigen Release-Adresse.
      - name: Ins Repository und Release legen
        run: |
          S=${{ matrix.sammlung }}
          rm -rf "trmnl/bilder/$S" && mkdir -p "trmnl/bilder/$S"
          cp bilder/$S-*.png bilder/$S.json "trmnl/bilder/$S/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trmnl/bilder/$S
          if ! git diff --cached --quiet; then
            git commit -q -m "Bildarchiv $S aktualisiert"
            for i in 1 2 3 4 5 6; do
              git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
              sleep $((i * 7))
            done
          fi
          gh release upload "${{ steps.tag.outputs.tag }}" "bilder/$S.json" --clobber
