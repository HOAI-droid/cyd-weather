# Baut die Firmware für beide CYD-Varianten und stellt sie als
# Einzeldatei (Adresse 0x0) im Release "firmware" bereit.
name: Firmware bauen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install platformio esptool==4.8.1

      - name: Kompilieren
        run: pio run -e cyd -e cyd2usb

      - name: Einzeldateien zum Flashen erzeugen
        run: |
          mkdir -p out
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          for env in cyd cyd2usb; do
            B=.pio/build/$env
            esptool.py --chip esp32 merge_bin -o out/cyd-wetter-$env.bin \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
              0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: cyd-wetter-firmware
          path: out/*.bin

      # Standard-Branch -> Release "firmware" (stabile Version).
      # Jeder andere Branch bekommt ein eigenes Vorab-Release
      # "firmware-<branch>", damit neue Versionen die alte nicht überschreiben.
      - name: Release aktualisieren
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            TAG=firmware
            TITLE="Aktuelle Firmware"
            EXTRA=""
          else
            TAG="firmware-$(echo "$BRANCH" | sed 's#^claude/##; s#[^A-Za-z0-9._-]#-#g')"
            TITLE="Test-Firmware ($BRANCH)"
            EXTRA="--prerelease"
          fi
          NOTES="Fertige Firmware zum Flashen an Adresse 0x0 (siehe README, Abschnitt 'Flashen im Browser'). Branch: $BRANCH, Stand: ${GITHUB_SHA::7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" $EXTRA
          fi
          gh release upload "$TAG" out/*.bin --clobber
