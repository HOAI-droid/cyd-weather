# Sammler für die Tafel der Luftfahrzeuge als kleiner Dauer-Container neben LaraPaper.
# 1. WEBHOOK_URL eintragen (in LaraPaper beim Plugin "Tafel der Luftfahrzeuge" unter "Webhook URL")
# 2. im Ordner dieser Datei: docker compose up -d
services:
  flugzeug-sammler:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./sammler.py:/app/sammler.py:ro
      - sammler-daten:/daten
    environment:
      - WEBHOOK_URL=http://LARAPAPER-ADRESSE:4567/api/custom_plugins/PLUGIN-UUID
      - LAT=49.9016
      - LON=8.6555
      - RADIUS_KM=20
      - ORT=Arheilgen
      - ZEITZONE=Europe/Berlin
      - ZUSTAND=/daten/zustand.json
      - SCHLEIFE=300
    command: ["python3", "-u", "sammler.py"]
volumes:
  sammler-daten:
