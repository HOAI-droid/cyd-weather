---
# Seite 1: Abfahrten, Wetter des Tages und Müll-Erinnerung (alle 5 Minuten neu)
name: "Abfahrt, Wetter & Müll"
id: cyd-abfahrt
strategy: polling
polling_verb: get
refresh_interval: 5
no_screen_padding: "yes"
dark_mode: "no"
# Eine Adresse pro Zeile. Reihenfolge nicht ändern: 1. Wetter, 2. Abfahrten, 3. Müll (darf fehlen).
polling_url: |-
  https://api.open-meteo.com/v1/forecast?latitude={{ breite }}&longitude={{ laenge }}&current=temperature_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,precipitation&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&minutely_15=precipitation&timezone=auto&forecast_days=2&forecast_minutely_15=9
  https://dbf.finalrewind.org/{{ haltestelle | url_encode | replace: "+", "%20" }}.json?hafas={{ verbund }}&version=3&admode=dep&limit=14&via={{ richtung | url_encode }}
  {% if strasse != blank %}https://ead.darmstadt.de/unser-angebot/privathaushalte/abfallkalender/singleStreet/?type=742394&street={{ strasse | url_encode }}{% endif %}
custom_fields:
  - keyname: info
    field_type: author_bio
    name: "Über dieses Plugin"
    description: "Abfahrten, Wetter des Tages und Müll-Erinnerung. Teil der CYD-Wetterstation (github.com/hoai-droid/cyd-weather)."
  - keyname: haltestelle
    field_type: string
    name: "Haltestelle"
    description: "Name der Haltestelle wie in der RMV-Auskunft."
    help_text: "Testen: <a href='https://dbf.finalrewind.org/?hafas=RMV' target='_blank'>dbf.finalrewind.org</a> öffnen, Haltestelle eingeben und den Namen genau so übernehmen."
    default: "Im Fiedlersee, Darmstadt"
  - keyname: richtung
    field_type: string
    name: "Richtung (über)"
    description: "Nur Fahrten, die über diese Haltestelle fahren. Leer lassen = alle Fahrten. Mehrere mit Komma trennen."
    default: "Willy-Brandt-Platz"
    optional: true
  - keyname: verbund
    field_type: select
    name: "Verkehrsverbund"
    options:
      - "RMV (Rhein-Main)": RMV
      - "NVV (Nordhessen)": NVV
      - "KVB (Köln)": KVB
      - "BVG (Berlin)": BVG
      - "NAH.SH (Schleswig-Holstein)": NAHSH
      - "VBN (Bremen/Niedersachsen)": VBN
    default: RMV
  - keyname: fussweg
    field_type: number
    name: "Fußweg zur Haltestelle (Minuten)"
    description: "Fahrten, die du nicht mehr erreichst, werden ausgegraut. Die erste erreichbare Fahrt steht groß oben."
    default: 3
  - keyname: ort
    field_type: string
    name: "Ortsname (Anzeige)"
    default: "Darmstadt"
  - keyname: breite
    field_type: string
    name: "Breitengrad"
    description: "Dezimalgrad mit Punkt, z. B. 49.87"
    help_text: "Nachschlagen: <a href='https://open-meteo.com/en/docs' target='_blank'>open-meteo.com</a> (oben Ort suchen) oder <a href='https://www.latlong.net/' target='_blank'>latlong.net</a> (auf die Karte klicken)."
    default: "49.8728"
  - keyname: laenge
    field_type: string
    name: "Längengrad"
    description: "Dezimalgrad mit Punkt, z. B. 8.65"
    default: "8.6512"
  - keyname: strasse
    field_type: string
    name: "Straße für den Müllkalender (EAD Darmstadt)"
    description: "Straßenname genau wie im EAD-Abfallkalender, ohne Hausnummer. Bei geteilten Straßen den Abschnitt mit angeben, z. B. „Heinheimer Straße 1-15, 2-16“. Leer lassen = kein Müll."
    help_text: "Schreibweise prüfen: <a href='https://www.ead.darmstadt.de/unser-angebot/privathaushalte/abfallkalender' target='_blank'>EAD-Abfallkalender</a>"
    default: "Im Fiedlersee"
    optional: true
  - keyname: erinnerung
    field_type: select
    name: "Müll-Erinnerung am Vorabend ab"
    options:
      - "15:00 Uhr": "15"
      - "16:00 Uhr": "16"
      - "17:00 Uhr": "17"
      - "18:00 Uhr": "18"
      - "19:00 Uhr": "19"
      - "20:00 Uhr": "20"
    default: "17"
  - keyname: spruch
    field_type: select
    name: "Wetterspruch anzeigen"
    options:
      - "Ja": "ja"
      - "Nein": "nein"
    default: "ja"
