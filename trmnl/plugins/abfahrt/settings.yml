---
# Seite 1: Abfahrtszeiten, Wetter des Tages und Mülltermine (alle 5 Minuten neu)
name: "Abfahrt, Wetter & Müll"
id: cyd-abfahrt
strategy: polling
polling_verb: get
refresh_interval: 5
no_screen_padding: "yes"
dark_mode: "no"
# Eine Adresse pro Zeile. Reihenfolge nicht ändern: 1. Wetter, 2. Abfahrten, 3. Müll (darf fehlen).
polling_url: |-
  https://api.open-meteo.com/v1/forecast?latitude={{ breite }}&longitude={{ laenge }}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,precipitation&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max&minutely_15=precipitation&timezone=auto&forecast_days=2&forecast_minutely_15=9
  {% if rmv_key != blank %}https://www.rmv.de/hapi/departureBoard?accessId={{ rmv_key | strip }}&id={{ haltestelle | strip | url_encode }}&format=json&maxJourneys=40&duration=180&passlist=1{% else %}https://dbf.finalrewind.org/{{ haltestelle | url_encode | replace: "+", "%20" }}.json?hafas={{ verbund }}&version=3&admode=dep&limit=14{% assign rrest = richtung | remove: "0" | remove: "1" | remove: "2" | remove: "3" | remove: "4" | remove: "5" | remove: "6" | remove: "7" | remove: "8" | remove: "9" %}{% if rrest != "" %}&via={{ richtung | url_encode }}{% endif %}{% endif %}
  {% if strasse != blank %}https://ead.darmstadt.de/unser-angebot/privathaushalte/abfallkalender/singleStreet/?type=742394&street={{ strasse | url_encode }}{% endif %}
custom_fields:
  - keyname: info
    field_type: author_bio
    name: "Über dieses Plugin"
    description: "Abfahrten, Wetter des Tages und Müll-Erinnerung. Teil der CYD-Wetterstation (github.com/hoai-droid/cyd-weather)."
  - keyname: rmv_key
    field_type: password
    name: "RMV-API-Schlüssel (optional)"
    description: "Mit Schlüssel kommen die Abfahrten direkt vom RMV. Dann muss bei Haltestelle die Haltestellen-Nummer stehen. Ohne Schlüssel läuft es über dbf.finalrewind.org."
    help_text: "Schlüssel beantragen: <a href='https://opendata.rmv.de' target='_blank'>opendata.rmv.de</a>"
    optional: true
  - keyname: haltestelle
    field_type: string
    name: "Haltestelle"
    description: "Haltestellen-Nummer (HAFAS-ID), funktioniert mit und ohne RMV-Schlüssel. Darmstadt-Arheilgen Im Fiedlersee = 3024329, Darmstadt Willy-Brandt-Platz = 3024747. Ohne Schlüssel geht auch der Name genau in RMV-Schreibweise."
    help_text: "Nummer nachsehen: in der RMV-Haltestellenliste (Spalte HAFAS_ID, <a href='https://opendata.rmv.de' target='_blank'>opendata.rmv.de</a>) oder im Browser https://www.rmv.de/hapi/location.name?accessId=DEIN_SCHLÜSSEL&input=Fiedlersee&format=json öffnen (Schlüssel einsetzen). Die Nummer steht bei „extId“, der genaue Name bei „name“. Ohne Schlüssel testen: <a href='https://dbf.finalrewind.org/?hafas=RMV' target='_blank'>dbf.finalrewind.org</a>."
    default: "3024329"
  - keyname: richtung
    field_type: string
    name: "Richtung (über)"
    description: "Nur Fahrten, die danach über diese Haltestelle fahren. Haltestellen-Nummer (nur mit RMV-Schlüssel, z. B. 3024747 = Darmstadt Willy-Brandt-Platz) oder ein Teil des Namens (geht immer, z. B. „Willy-Brandt-Platz“). Leer lassen = alle Fahrten."
    default: "3024747"
    optional: true
  - keyname: verbund
    field_type: select
    name: "Verkehrsverbund (nur ohne RMV-Schlüssel)"
    options:
      - "RMV (Rhein-Main)": RMV
      - "NVV (Nordhessen)": NVV
      - "KVB (Köln)": KVB
      - "BVG (Berlin)": BVG
      - "NAH.SH (Schleswig-Holstein)": NAHSH
      - "VBN (Bremen/Niedersachsen)": VBN
    default: RMV
  - keyname: schrift
    field_type: select
    name: "Schriftgröße"
    description: "Groß: 5 Abfahrten, große Temperaturen, aus der Ferne lesbar. Normal: bis zu 9 Abfahrten und mehr Details (die frühere Ansicht)."
    options:
      - "Groß (aus der Ferne lesbar)": gross
      - "Normal (mehr Abfahrten)": normal
    default: gross
  - keyname: ort
    field_type: string
    name: "Ortsname (Anzeige)"
    default: "Darmstadt"
  - keyname: breite
    field_type: string
    name: "Breitengrad"
    description: "Dezimalgrad mit Punkt, z. B. 49.87"
    help_text: "Nachschlagen: <a href='https://open-meteo.com/en/docs' target='_blank'>open-meteo.com</a> (oben Ort suchen) oder <a href='https://www.latlong.net/' target='_blank'>latlong.net</a> (auf die Karte klicken)."
    default: "49.9016"
  - keyname: laenge
    field_type: string
    name: "Längengrad"
    description: "Dezimalgrad mit Punkt, z. B. 8.65"
    default: "8.6555"
  - keyname: strasse
    field_type: string
    name: "Straße für den Müllkalender (EAD Darmstadt)"
    description: "Straßenname genau wie im EAD-Abfallkalender, ohne Hausnummer. Bei geteilten Straßen den Abschnitt mit angeben, z. B. „Heinheimer Straße 1-15, 2-16“. Leer lassen = kein Müll."
    help_text: "Schreibweise prüfen: <a href='https://www.ead.darmstadt.de/unser-angebot/privathaushalte/abfallkalender' target='_blank'>EAD-Abfallkalender</a>"
    default: "Im Fiedlersee"
    optional: true
  - keyname: erinnerung
    field_type: select
    name: "Müll-Erinnerung am Vorabend ab"
    options:
      - "15:00 Uhr": "15"
      - "16:00 Uhr": "16"
      - "17:00 Uhr": "17"
      - "18:00 Uhr": "18"
      - "19:00 Uhr": "19"
      - "20:00 Uhr": "20"
    default: "17"
  - keyname: spruch
    field_type: select
    name: "Wetterspruch anzeigen"
    options:
      - "Ja": "ja"
      - "Nein": "nein"
    default: "ja"
