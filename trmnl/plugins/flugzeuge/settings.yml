---
# Kunst: Tafel der Luftfahrzeuge, die gerade über dem Ort in der Luft sind (live von adsb.lol, kein Schlüssel nötig)
name: "Tafel der Luftfahrzeuge"
id: cyd-flugzeuge
strategy: polling
polling_verb: get
refresh_interval: 5
no_screen_padding: "yes"
dark_mode: "no"
polling_url: "https://api.adsb.lol/v2/point/{{ breite }}/{{ laenge }}/{{ radius }}"
custom_fields:
  - keyname: info
    field_type: author_bio
    name: "Über dieses Plugin"
    description: "Alle Flugzeuge, die gerade im Umkreis in der Luft sind, als gestochene Seitenansichten im selben Maßstab. Daten: adsb.lol (ADS-B-Gemeinschaftsnetz), ohne Schlüssel."
  - keyname: ort
    field_type: string
    name: "Ortsname (Überschrift)"
    default: "Arheilgen"
  - keyname: breite
    field_type: string
    name: "Breitengrad"
    description: "Dezimalgrad mit Punkt"
    default: "49.9016"
  - keyname: laenge
    field_type: string
    name: "Längengrad"
    default: "8.6555"
  - keyname: radius
    field_type: select
    name: "Umkreis"
    options:
      - "10 km": "5.4"
      - "15 km": "8.1"
      - "20 km": "10.8"
      - "30 km": "16.2"
    default: "10.8"
  - keyname: schraffur
    field_type: select
    name: "Zeichnung"
    options:
      - "Stich (mit Schraffur)": stich
      - "Nur Linien": linien
    default: stich
  - keyname: rand
    field_type: select
    name: "Rand (für Bilderrahmen)"
    description: "Abstand des Inhalts zum Displayrand. In Mashups wird der halbe Rand verwendet."
    options:
      - "Ohne": "0"
      - "Schmal": "12"
      - "Mittel": "20"
      - "Breit": "30"
    default: "20"
  - keyname: zeitzone
    field_type: select
    name: "Uhrzeit"
    options:
      - "Deutschland (MEZ/MESZ)": deutschland
      - "Zeitzone aus LaraPaper": larapaper
    default: deutschland
  - keyname: bilder
    field_type: url
    name: "Adresse der Zeichnungen"
    description: "Nur ändern, wenn die Zeichnungen woanders liegen."
    default: "https://raw.githubusercontent.com/HOAI-droid/cyd-weather/claude/trmnl-app/trmnl/kunst/flugzeuge/bilder/"
